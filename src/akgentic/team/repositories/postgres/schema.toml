[team_process_entries]
natural_key = ["id"]
[team_process_entries.columns]
id = "str"
data = "json"
metadata_indexes = "str[]"

[event_entries]
natural_key = ["team_id", "sequence"]
[event_entries.columns]
team_id = "str"
sequence = "int"
data = "json"

[agent_state_entries]
natural_key = ["team_id", "agent_id"]
[agent_state_entries.columns]
team_id = "str"
agent_id = "str"
data = "json"

# The content-addressed agent-card store. No team_id: cards are shared across
# every team that references them, and delete_team deliberately never touches
# this table.
[agent_card_entries]
natural_key = ["card_hash"]
[agent_card_entries.columns]
card_hash = "str"
data = "json"
